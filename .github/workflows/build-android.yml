name: Build Android APK (Cloud)

on:
  workflow_dispatch: # 允许在网页端手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 极其重要：拉取 Go 核心子模块，否则必败

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install Dependencies
        run: |
          flutter pub get
          go version
          flutter --version

      - name: Build APK
        run: |
          # 运行官方构建脚本，它会自动处理 Go 核心编译和 Flutter 打包
          dart setup.dart android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Android-APK
          # flutter_distributor 通常输出到 dist 目录，备用路径也加上以防万一
          path: |
            dist/*.apk
            build/app/outputs/flutter-apk/*.apk
